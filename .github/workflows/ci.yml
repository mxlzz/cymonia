name: Nilo external audit - physical operations and procedures
on:
  push:
    branches: ['lab/nilo-physical-procedures']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  focused-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59ad10f94f2a39657339ae1c271746eeeede2ad9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact baseline and environment
        run: |
          git rev-parse HEAD
          node --version
      - name: Physical operations and learned procedures
        run: node --test tests/test_sovereign_physical_operations.mjs tests/test_sovereign_procedures.mjs
